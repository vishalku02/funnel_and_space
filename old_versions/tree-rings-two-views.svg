<svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="1040" height="600" fill="#fdf6ee"/>

  <!-- ───── Title ───── -->
  <text x="520" y="44" text-anchor="middle" font-size="22" fill="#2d2420">One model, two views</text>
  <text x="520" y="68" text-anchor="middle" font-size="13" fill="#a09080" font-style="italic">
    Start overhead (abstract, echoes the M4 surround) — then tip the camera and the tree appears.
  </text>

  <!-- ════════ LEFT: PLAN / overhead rings ════════ -->
  <g>
    <text x="265" y="108" text-anchor="middle" font-size="11" letter-spacing="0.15em" fill="#9a7850">PLAN — LOOKING DOWN THE AXIS</text>

    <!-- outer ring: relationship / medium -->
    <circle cx="265" cy="320" r="170" fill="#dde3d0" stroke="#b8c4a8" stroke-width="1.5"/>
    <!-- mid ring: learning -->
    <circle cx="265" cy="320" r="115" fill="#ecd9bf" stroke="#c4a882" stroke-width="1.5"/>
    <!-- inner core: the forms -->
    <circle cx="265" cy="320" r="58" fill="#9a7850" stroke="#7a5c3c" stroke-width="1.5"/>
    <!-- center: Maya / trunk-core -->
    <circle cx="265" cy="320" r="9" fill="#2d2420"/>

    <!-- ring labels -->
    <text x="265" y="324" text-anchor="middle" font-size="10.5" fill="#fdf6ee">THE FORMS</text>
    <text x="265" y="338" text-anchor="middle" font-size="8" fill="#e8d8c4">funnel·tube·space</text>
    <text x="265" y="248" text-anchor="middle" font-size="11" fill="#8a6a44">LEARNING</text>
    <text x="265" y="172" text-anchor="middle" font-size="11" fill="#6a7a52">RELATIONSHIP — the medium</text>

    <text x="265" y="520" text-anchor="middle" font-size="10.5" fill="#a09080" font-style="italic">the medium is the outermost ring;</text>
    <text x="265" y="537" text-anchor="middle" font-size="10.5" fill="#a09080" font-style="italic">the forms are the small core at center</text>
  </g>

  <!-- ════════ Rotation arrow between panels ════════ -->
  <g>
    <path d="M 470 300 C 520 270, 560 270, 600 300" fill="none" stroke="#c4a882" stroke-width="1.5"/>
    <path d="M 600 300 l -11 -4 l 4 11 z" fill="#c4a882"/>
    <text x="535" y="262" text-anchor="middle" font-size="10.5" fill="#9a7850" font-style="italic">tip 90°</text>
  </g>

  <!-- ════════ RIGHT: ELEVATION / the tree ════════ -->
  <g>
    <text x="775" y="108" text-anchor="middle" font-size="11" letter-spacing="0.15em" fill="#9a7850">ELEVATION — FROM THE SIDE</text>

    <!-- air / light (relationship, above) -->
    <text x="940" y="150" text-anchor="end" font-size="10" fill="#6a7a52" font-style="italic">air + light</text>
    <text x="940" y="164" text-anchor="end" font-size="10" fill="#6a7a52" font-style="italic">(relationship)</text>
    <circle cx="905" cy="135" r="15" fill="none" stroke="#c4a882" stroke-width="1.2"/>
    <line x1="905" y1="108" x2="905" y2="118" stroke="#c4a882" stroke-width="1.2"/>
    <line x1="905" y1="152" x2="905" y2="162" stroke="#c4a882" stroke-width="1.2"/>
    <line x1="878" y1="135" x2="888" y2="135" stroke="#c4a882" stroke-width="1.2"/>
    <line x1="922" y1="135" x2="932" y2="135" stroke="#c4a882" stroke-width="1.2"/>

    <!-- canopy: co-construction -->
    <path d="M 775 130 C 690 130, 660 215, 705 245 C 660 270, 700 320, 760 305
             C 775 330, 800 330, 815 305 C 875 320, 915 270, 870 245
             C 915 215, 885 130, 800 130 Z"
          fill="#ecd9bf" stroke="#c4a882" stroke-width="1.5"/>
    <text x="787" y="215" text-anchor="middle" font-size="11" fill="#8a6a44">CANOPY</text>
    <text x="787" y="231" text-anchor="middle" font-size="9" fill="#a08658">co-construction · CoP</text>

    <!-- fruit (one falling) -->
    <circle cx="725" cy="270" r="6" fill="#b8553c"/>
    <circle cx="845" cy="262" r="6" fill="#b8553c"/>
    <circle cx="800" cy="470" r="6" fill="#b8553c" opacity="0.85"/>
    <text x="828" y="474" font-size="9" fill="#a09080" font-style="italic">fruit falls back into the soil</text>

    <!-- trunk: the forms / objective -->
    <path d="M 772 305 C 768 360, 766 400, 762 432 L 812 432 C 808 400, 806 360, 802 305 Z"
          fill="#9a7850" stroke="#7a5c3c" stroke-width="1.5"/>
    <text x="787" y="372" text-anchor="middle" font-size="9.5" fill="#fdf6ee">TRUNK</text>
    <text x="787" y="386" text-anchor="middle" font-size="7.5" fill="#e8d8c4">funnel / objective</text>
    <text x="700" y="345" text-anchor="end" font-size="9" fill="#a09080" font-style="italic">bark —</text>
    <text x="700" y="358" text-anchor="end" font-size="9" fill="#a09080" font-style="italic">necessary,</text>
    <text x="700" y="371" text-anchor="end" font-size="9" fill="#a09080" font-style="italic">sealed off</text>

    <!-- soil band: relationship below -->
    <rect x="600" y="432" width="350" height="78" fill="#dde3d0" stroke="#b8c4a8" stroke-width="1.5"/>
    <text x="775" y="455" text-anchor="middle" font-size="11" fill="#6a7a52">SOIL — relationship (the medium)</text>

    <!-- roots into soil -->
    <path d="M 762 432 C 745 455, 720 470, 700 495" fill="none" stroke="#7a5c3c" stroke-width="1.5"/>
    <path d="M 787 432 C 787 460, 785 480, 783 500" fill="none" stroke="#7a5c3c" stroke-width="1.5"/>
    <path d="M 812 432 C 829 455, 854 470, 874 495" fill="none" stroke="#7a5c3c" stroke-width="1.5"/>
    <text x="775" y="498" text-anchor="middle" font-size="8.5" fill="#6a5a4e" font-style="italic">roots = divergent individual experience, drawn from human ground</text>

    <text x="775" y="537" text-anchor="middle" font-size="10.5" fill="#a09080" font-style="italic">the medium surrounds (soil below, air above); the form is the core</text>
  </g>

  <!-- ════════ mapping key (bottom) ════════ -->
  <g>
    <rect x="170" y="560" width="14" height="14" fill="#dde3d0" stroke="#b8c4a8"/>
    <text x="190" y="571" font-size="10" fill="#6a5a4e">relationship / medium</text>
    <rect x="360" y="560" width="14" height="14" fill="#ecd9bf" stroke="#c4a882"/>
    <text x="380" y="571" font-size="10" fill="#6a5a4e">learning</text>
    <rect x="500" y="560" width="14" height="14" fill="#9a7850" stroke="#7a5c3c"/>
    <text x="520" y="571" font-size="10" fill="#6a5a4e">the forms (funnel·tube·space)</text>
    <circle cx="737" cy="567" r="6" fill="#b8553c"/>
    <text x="750" y="571" font-size="10" fill="#6a5a4e">fruit → returns to the soil</text>
  </g>
</svg>
